<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>komendant-zero</title>
  <meta name="description" content="Building desktop and mobile tools."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #06080d;
      --surface: #0c101a;
      --border:  #1c2438;
      --accent:  #4f8cff;
      --text:    #d4deef;
      --dim:     #5a6a88;
      --mono:    'Space Mono', monospace;
      --sans:    'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle, #1a2236 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .glow-top {
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(79,140,255,0.1) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── WRAP ── */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ── HERO ── */
    .hero {
      padding: 12vh 0 4vh;
    }

    .hero-eyebrow {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      opacity: 0;
      animation: up 0.6s 0.1s ease forwards;
    }

    .hero-eyebrow::before {
      content: '';
      width: 28px;
      height: 1px;
      background: var(--accent);
      display: block;
    }

    .hero-name {
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      white-space: nowrap;
      margin-bottom: 1rem;
      opacity: 0;
      animation: up 0.7s 0.2s ease forwards;
    }

    .hero-name .solid { color: #eaf0ff; }

    .hero-name .outline {
      color: transparent;
      -webkit-text-stroke: 1.5px var(--accent);
    }

    .hero-tagline {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--dim);
      letter-spacing: 0.04em;
      margin-bottom: 2rem;
      opacity: 0;
      animation: up 0.7s 0.32s ease forwards;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 1em;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: middle;
      position: relative;
      top: -0.05em;
      animation: blink 1s step-end infinite;
    }

    /* ── STACK ICONS ── */
    .stack-icons {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      margin-bottom: 3rem;
      opacity: 0;
      animation: up 0.7s 0.44s ease forwards;
    }

    .stack-icon-wrapper {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .stack-icon-wrapper svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stack-icon-wrapper:hover {
      color: var(--accent);
      transform: translateY(-4px) scale(1.15);
      filter: drop-shadow(0 6px 12px rgba(79,140,255,0.35));
    }

    /* ── PROJECT GRID ── */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
      cursor: pointer;
      opacity: 0;
      animation: up 0.7s 0.55s ease forwards;
    }

    .project-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), #7c5cfc);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .project-card:hover {
      border-color: rgba(79,140,255,0.35);
      transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(79,140,255,0.08);
    }

    .project-card:hover::before { opacity: 1; }

    .project-num {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--accent);
      letter-spacing: 0.25em;
    }

    .project-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: #eaf0ff;
      letter-spacing: -0.02em;
    }

    .project-desc {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--dim);
      line-height: 1.7;
      flex: 1;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.25rem;
    }

    .project-tag {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.2rem 0.55rem;
      letter-spacing: 0.06em;
      transition: all 0.2s;
    }

    .project-card:hover .project-tag {
      border-color: rgba(79,140,255,0.2);
      color: var(--accent);
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 5rem;
    }

    footer span, footer a {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--dim);
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--accent); }

    /* ── ANIMS ── */
    @keyframes up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @media (max-width: 540px) {
      .hero-name { white-space: normal; }
      .project-grid { grid-template-columns: 1fr; }
      .hero { padding: 8vh 0 4vh; }
    }
  </style>
</head>
